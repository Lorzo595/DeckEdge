name: Suggest an improvement
description: An idea to make DeckEdge more useful
title: "[Idea] "
body:
  - type: textarea
    id: need
    attributes:
      label: What workflow would you like to improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior you want and, if possible, a concrete example.
    validations:
      required: true
