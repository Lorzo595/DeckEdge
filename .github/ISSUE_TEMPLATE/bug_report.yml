name: Report a bug
description: A problem with DeckEdge or its installation
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Thanks! Never attach your Discord credentials, your private phone link or your full data folder. Mask personal information in screenshots and logs."
  - type: input
    id: version
    attributes:
      label: DeckEdge version
      description: Shown in Settings → About.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: Installation mode
      options: [Standard installation, Portable build, From source]
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result and actual result
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional information
      description: Phone/browser, affected hardware, cleaned screenshot or log excerpt, if useful.
