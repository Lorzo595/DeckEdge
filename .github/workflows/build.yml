name: Windows packages
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package
        shell: pwsh
        run: ./packaging/build-release.ps1
      - name: Check clean distributions
        shell: pwsh
        run: ./packaging/check-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DeckEdge-Windows-x64
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DeckEdge-Windows-x64
          path: dist
      - name: Create a reviewable draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag et VERSION différents.' }
          gh release view $env:GITHUB_REF_NAME --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'Cette Release existe déjà : ses fichiers sont conservés.'
            exit 0
          }
          gh release create $env:GITHUB_REF_NAME --verify-tag --draft --prerelease --title "DeckEdge $version — version de test" --notes-file docs/RELEASE-NOTES.md dist/*
          if ($LASTEXITCODE -ne 0) { throw 'Création de la Release impossible.' }
