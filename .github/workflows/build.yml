name: Windows packages
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deckedge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Python tests
        shell: pwsh
        run: python -m unittest discover -s tests -t . -p "test_*.py"
      - name: C# preferences smoke test
        shell: pwsh
        run: ./tests/run-csharp-smoke.ps1
      - name: In-app updater smoke test
        shell: pwsh
        run: ./tests/run-update-smoke.ps1
      - name: Install Playwright
        shell: pwsh
        run: |
          npm install --no-save --no-package-lock playwright@1.65.1
          npx playwright install msedge
      - name: Studio and mobile browser tests
        shell: pwsh
        run: ./tests/run-ui-tests.ps1
  build:
    needs: test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package
        shell: pwsh
        run: ./packaging/build-release.ps1
      - name: Check clean distributions
        shell: pwsh
        run: ./packaging/check-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DeckEdge-Windows-x64
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DeckEdge-Windows-x64
          path: dist
      - name: Create a reviewable draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag et VERSION différents.' }
          gh release view $env:GITHUB_REF_NAME --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'Cette Release existe déjà : ses fichiers sont conservés.'
            exit 0
          }
          gh release create $env:GITHUB_REF_NAME --verify-tag --draft --prerelease --title "DeckEdge $version — pre-release" --notes-file docs/RELEASE-NOTES.md dist/*
          if ($LASTEXITCODE -ne 0) { throw 'Création de la Release impossible.' }
